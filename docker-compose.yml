services:
  db:
    # pgvector image = normal PostgreSQL + vector search support (used in the AI stage)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matchdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matchdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
